<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>FILON</title>
    <style>
      :root { color-scheme: light; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        width: 328px;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, system-ui, sans-serif;
        background: #f4f7fa;
        color: #0f1b2d;
        font-size: 14px;
        line-height: 1.5;
        letter-spacing: -0.01em;
        -webkit-font-smoothing: antialiased;
      }
      .head {
        display: flex; align-items: center; gap: 11px;
        padding: 18px 18px 16px;
        background:
          radial-gradient(120% 140% at 0% 0%, rgba(24,190,176,0.16), transparent 60%),
          radial-gradient(120% 140% at 100% 0%, rgba(30,117,201,0.16), transparent 60%),
          #ffffff;
        border-bottom: 1px solid rgba(16,40,70,0.07);
      }
      .brand { line-height: 1.1; }
      .brand b { font-family: Georgia, "Times New Roman", serif; font-size: 20px; letter-spacing: 0.06em; }
      .brand small { display: block; color: #5b6b80; font-size: 11px; font-weight: 500; margin-top: 1px; }
      .body { padding: 16px 18px 6px; }
      .lbl { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; color: #4a90b5; margin-bottom: 8px; }
      form { display: flex; flex-direction: column; gap: 9px; }
      input {
        width: 100%; padding: 12px 14px; border-radius: 12px; font-size: 14px;
        border: 1px solid rgba(16,40,70,0.14); background: #fff; color: #0f1b2d; outline: none;
        transition: border-color 0.15s ease, box-shadow 0.15s ease;
      }
      input:focus { border-color: #1e75c9; box-shadow: 0 0 0 3px rgba(30,117,201,0.14); }
      .cta {
        border: 0; cursor: pointer; padding: 13px 16px; border-radius: 12px; font-size: 14.5px;
        font-weight: 650; color: #fff; letter-spacing: -0.01em;
        background: linear-gradient(120deg, #18beb0, #1e75c9);
        box-shadow: 0 12px 26px -12px rgba(30,117,201,0.7);
        transition: transform 0.18s ease, filter 0.18s ease;
      }
      .cta:hover { transform: translateY(-1px); filter: brightness(1.04); }
      .ghost {
        display: flex; align-items: center; justify-content: center; gap: 8px;
        margin-top: 9px; padding: 11px 14px; border-radius: 12px; cursor: pointer; width: 100%;
        border: 1px solid rgba(16,40,70,0.14); background: #fff; color: #0f1b2d; font-size: 13.5px; font-weight: 600;
        transition: border-color 0.15s ease, background 0.15s ease;
      }
      .ghost:hover { border-color: #1e75c9; background: #f3f8fd; }
      .links { display: flex; gap: 8px; margin: 14px 0 4px; }
      .links a {
        flex: 1; text-align: center; text-decoration: none; color: #0f1b2d; font-size: 12.5px; font-weight: 600;
        padding: 10px 6px; border-radius: 11px; background: rgba(16,40,70,0.045);
        transition: background 0.15s ease;
      }
      .links a:hover { background: rgba(30,117,201,0.1); }
      .foot { padding: 12px 18px 16px; font-size: 10.5px; color: #8494a6; line-height: 1.55; text-align: center; }
    </style>
  </head>
  <body>
    <div class="head">
      <svg viewBox="0 0 240 240" width="32" height="32" aria-hidden="true">
        <defs><linearGradient id="plg" gradientUnits="userSpaceOnUse" x1="95" y1="166" x2="156" y2="78"><stop stop-color="#86D1B0" /><stop offset="1" stop-color="#8FB9E6" /></linearGradient></defs>
        <rect x="8" y="8" width="224" height="224" rx="49.28" fill="#26364B" />
        <g fill="none" stroke="url(#plg)" stroke-width="17" stroke-linecap="round" stroke-linejoin="round"><path d="M95 78 L95 166" /><path d="M95 78 L156 78" /><path d="M95 121 L145 121" /></g>
        <circle cx="156" cy="78" r="10.5" fill="#EF9F27" />
      </svg>
      <div class="brand"><b>FILON</b><small>Le vrai prix, avant d'acheter.</small></div>
    </div>

    <div class="body">
      <div class="lbl">Que voulez-vous acheter&nbsp;?</div>
      <form id="ask">
        <input id="q" type="text" placeholder="Ex. : iPhone 16, aspirateur Dyson…" autofocus />
        <button class="cta" type="submit">Demander à FILON&nbsp;→</button>
      </form>
      <button class="ghost" id="analyze">Analyser la page ouverte</button>

      <div class="links">
        <a href="https://filon.be/cashback" target="_blank" rel="noopener">Cashback</a>
        <a href="https://filon.be/reconditionne" target="_blank" rel="noopener">Reconditionné</a>
        <a href="https://filon.be/comment-ca-marche" target="_blank" rel="noopener">Le concept</a>
      </div>
    </div>

    <div class="foot">
      Gratuit · indépendant · Belgique. Certains liens sont affiliés — cela n'augmente jamais votre prix, et vos données ne sont jamais revendues.
    </div>
    <script src="popup.js"></script>
  </body>
</html>

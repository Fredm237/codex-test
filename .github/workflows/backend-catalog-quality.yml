name: Qualité catalogue backend

on:
  pull_request:
    paths:
      - "filon-backend/**"
      - ".github/workflows/backend-catalog-quality.yml"
  push:
    branches: [main]
    paths:
      - "filon-backend/**"
      - ".github/workflows/backend-catalog-quality.yml"
  workflow_dispatch:

jobs:
  backend-tests:
    name: Régressions taxonomie et contrat API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: filon-backend
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: filon-backend/requirements.txt

      - name: Installer les dépendances
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Exécuter les régressions catalogue
        run: python -m pytest -q

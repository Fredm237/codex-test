name: Core — quality gates

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-tests:
    name: Backend, contrats et Quality Lab
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: filon
          POSTGRES_PASSWORD: filon
          POSTGRES_DB: filon_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U filon -d filon_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_POSTGRES_URL: postgresql+asyncpg://filon:filon@127.0.0.1:5432/filon_test
    defaults:
      run:
        working-directory: filon-backend
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: filon-backend/requirements.txt

      - name: Installer les dépendances
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt

      - name: Tester baseline, stamp, drift et restauration Alembic
        run: >-
          python -m pytest -q
          tests/test_migrations.py
          tests/test_migrations_postgresql.py

      - name: Exécuter les régressions catalogue
        run: python -m pytest -q

      - name: Conserver le reçu historique sans ground truth externe
        if: ${{ !cancelled() }}
        run: >-
          python -m quality_lab.evaluate
          --manifest ../quality/manifest.json
          --output ../quality-external-ground-truth-limitation.json

      - name: Exécuter le Quality Lab autonome fail-closed
        if: ${{ !cancelled() }}
        run: >-
          python -m quality_lab.autonomous
          --manifest ../quality/autonomous-manifest.json
          --strict
          --output ../quality-autonomous-report.json

      - name: Exécuter le benchmark Product Identity exact-product
        if: ${{ !cancelled() }}
        run: >-
          python -m quality_lab.product_identity
          --manifest ../quality/product-identity-manifest.json
          --strict
          --output ../quality-product-identity-report.json

      - name: Exécuter le benchmark Entity Resolution
        if: ${{ !cancelled() }}
        run: >-
          python -m quality_lab.entity_resolution
          --manifest ../quality/entity-resolution-manifest.json
          --adapter multi
          --require-promotion
          --output ../quality-entity-resolution-report.json

      - name: Ratifier le benchmark Product Ontology sans promouvoir l'oracle
        if: ${{ !cancelled() }}
        run: >-
          python -m quality_lab.product_ontology
          --manifest ../quality/product-ontology-manifest.json
          --adapter oracle
          --output ../quality-product-ontology-report.json

      - name: Exécuter le benchmark Constraint Engine fail-closed
        if: ${{ !cancelled() }}
        run: >-
          python -m quality_lab.constraint_engine
          --manifest ../quality/constraint-engine-manifest.json
          --adapter constraint_engine
          --strict
          --output ../quality-constraint-engine-report.json

      - name: Exécuter les garde-fous Product Ranking sans simuler la preuve humaine
        if: ${{ !cancelled() }}
        run: >-
          python -m quality_lab.product_ranking
          --manifest ../quality/product-ranking-manifest.json
          --adapter product_ranking
          --strict-engineering
          --output ../quality-product-ranking-report.json

      - name: Exécuter les garde-fous Offer Optimization sans signal commercial
        if: ${{ !cancelled() }}
        run: >-
          python -m quality_lab.offer_optimization
          --manifest ../quality/offer-optimization-manifest.json
          --adapter offer_optimization
          --strict-engineering
          --output ../quality-offer-optimization-report.json

      - name: Exécuter la calibration Confidence ECE Brier et buckets
        if: ${{ !cancelled() }}
        run: >-
          python -m quality_lab.confidence
          --manifest ../quality/confidence-manifest.json
          --adapter confidence
          --strict-engineering
          --output ../quality-confidence-report.json

      - name: Publier les rapports Quality Lab
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: quality-readiness-${{ github.sha }}
          path: |
            ${{ github.workspace }}/quality-autonomous-report.json
            ${{ github.workspace }}/quality-external-ground-truth-limitation.json
            ${{ github.workspace }}/quality-product-identity-report.json
            ${{ github.workspace }}/quality-entity-resolution-report.json
            ${{ github.workspace }}/quality-product-ontology-report.json
            ${{ github.workspace }}/quality-constraint-engine-report.json
            ${{ github.workspace }}/quality-product-ranking-report.json
            ${{ github.workspace }}/quality-offer-optimization-report.json
            ${{ github.workspace }}/quality-confidence-report.json
          if-no-files-found: warn
          retention-days: 14

  web-tests:
    name: Web — contrats, tests et build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: filon-web
    env:
      NEXT_PUBLIC_FILON_API: http://127.0.0.1:9
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: filon-web/package-lock.json

      - name: Installer les dépendances verrouillées
        run: npm ci

      - name: Tester les contrats et composants
        run: npm test

      - name: Construire le web sans dépendre de la production
        run: npm run build

  mobile-tests:
    name: Mobile — types, lint et tests hermétiques
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: filon-mobile
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: filon-mobile/pnpm-lock.yaml

      - name: Installer les dépendances verrouillées
        run: pnpm install --frozen-lockfile

      - name: Vérifier les types
        run: pnpm check

      - name: Vérifier les règles React
        run: pnpm lint

      - name: Exécuter les tests hermétiques
        run: pnpm test

  extension-tests:
    name: Extension — contrat, manifeste et syntaxe
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: filon-extension
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Vérifier le contrat v1
        run: node tests/contract-v1.mjs

      - name: Vérifier les scripts Manifest V3
        run: |
          node --check background.js
          node --check content.js
          node --check popup.js

      - name: Vérifier le manifeste
        run: node -e 'const m=require("./manifest.json"); if(m.manifest_version!==3) process.exit(1)'
